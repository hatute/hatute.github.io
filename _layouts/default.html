<!DOCTYPE html>
<html lang="en">
  <head>
    <script
      defer
      src="https://umami.nullserver.name/script.js"
      data-website-id="6551f481-5794-480a-b01e-14837c60884d"
    ></script>
    <script>
      MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
          processEscapes: true,
          processEnvironments: true,
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"],
        },
      };
    </script>
    <script
      defer
      src="https://polyfill.io/v3/polyfill.min.js?features=es6"
    ></script>
    <script
      defer
      id="MathJax-script"
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5"
    />
    <link
      rel="icon"
      href="{{ '/assets/img/cube-3d.png' | relative_url }}"
    />
    <title>
      {% if site.title %} {{ page.title }} | {{ site.title }} {% else %} {{
      page.title }} {% endif %}
    </title>
    <!-- <link
      rel="stylesheet"
      href="{{ '/assets/css/styles.bak.css' | relative_url }}"
    /> -->
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link rel="stylesheet" href="{{ "/assets/css/galleries.css" | prepend:
    site.baseurl }}">
  </head>
  <body class="{% if page.url == '/' %}home{% else %}page{% endif %}">
    {% if page.url != "/" %}
    <div class="nav">
      <ul class="wrap">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/posts">Posts</a></li>
        <li><a href="/publications">Publications</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </div>
    {% endif %}

    <main>{{ content }}</main>

    <footer>&copy; 2020&ndash;<span id="copyright-year"></span> hatute</footer>
    <script>document.getElementById('copyright-year').textContent = new Date().getFullYear();</script>
  </body>
</html>
