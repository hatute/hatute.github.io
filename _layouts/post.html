---
layout: default
---

<div class="content">
  <div class="front-matter">
    <div class="wrap">
      <h1>{{ page.title }}</h1>
      {% if page.description %}
      <h4>{{ page.description }}</h4>
      {% endif %}
      <div class="bylines">
        <div class="byline">
          <h3>Published</h3>
          <p>{{ page.date | date: "%d %B %Y" }}</p>
        </div>
      </div>
      <div class="clear"></div>
    </div>
  </div>
  <div class="wrap article">
    {{ content }}
  </div>
</div>
